name: add-ads-once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: insert ad tag
        run: |
          python3 - <<'PY'
          import glob
          tag='<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4434695896885099" crossorigin="anonymous"></script>'
          done=skipped=nohead=0
          for p in glob.glob('**/*.html', recursive=True):
              s=open(p,encoding='utf-8').read()
              if 'adsbygoogle' in s:
                  skipped+=1; continue
              if '</head>' not in s:
                  nohead+=1; print('NOHEAD',p); continue
              open(p,'w',encoding='utf-8',newline='').write(s.replace('</head>',tag+'</head>',1))
              done+=1
          print('done',done,'skipped',skipped,'nohead',nohead)
          PY
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "Add AdSense tag to all pages" || echo nothing
          git push
